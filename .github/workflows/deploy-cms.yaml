name: Deploy my CMS to AWS Lambda

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-laravel-template.yaml
    with:
      app_name: ${{ vars.CMS_APP_NAME }}
      github_repo_url: ${{ vars.CMS_APP_GITHUB_URL }}
      custom_domain_name: ${{ vars.CMS_CUSTOM_DOMAIN_NAME }}
      certificate_arn: ${{ vars.CMS_CERTIFICATE_ARN }}
      aws_bucket: ${{ vars.CMS_AWS_BUCKET }}
      asset_bucket: ${{ vars.CMS_ASSET_AWS_BUCKET }}
      enable_vpc: true
      subnet_ids: ${{ vars.CMS_SUBNET_IDS }}
      security_group_ids: ${{ vars.CMS_SECURITY_GROUP_IDS }}
      enable_filesystem: true
      access_point_arn: ${{ vars.CMS_ACCESS_POINT_ARN }}
      tag_service: ${{ vars.CMS_TAG_SERVICE }}
      tag_environment: ${{ vars.CMS_TAG_ENVIRONMENT }}
      tag_owner: ${{ vars.CMS_TAG_OWNER }}
      extra_artisan_pre_build: "php artisan optimize && php artisan migrate --force && php artisan wayfinder:generate"
      ssm_parameter_name: "/docfunc-cms/env"
      state_key: "us-west-2-blog-cms-serverless.tfstate"
