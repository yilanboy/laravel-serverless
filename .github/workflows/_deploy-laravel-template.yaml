name: Reusable Laravel Serverless Deployment

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name used for resource naming"
        required: true
        type: string

      github_repo_url:
        description: "GitHub repository URL of the Laravel application"
        required: true
        type: string

      custom_domain_name:
        description: "Custom domain name for the API Gateway"
        required: true
        type: string

      certificate_arn:
        description: "ACM Certificate ARN for the custom domain"
        required: true
        type: string

      aws_bucket:
        description: "S3 bucket for Laravel storage/blobs"
        required: true
        type: string

      asset_bucket:
        description: "S3 bucket for public static assets (leave empty to skip asset sync)"
        required: false
        type: string
        default: ""

      enable_vpc:
        description: "Whether to attach Lambda functions to a VPC"
        required: false
        type: boolean
        default: true

      subnet_ids:
        description: 'List of subnet IDs in JSON format, e.g. ''["subnet-xxx"]'''
        required: false
        type: string
        default: "[]"

      security_group_ids:
        description: 'List of security group IDs in JSON format, e.g. ''["sg-xxx"]'''
        required: false
        type: string
        default: "[]"

      enable_filesystem:
        description: "Whether to mount EFS to Lambda functions"
        required: false
        type: boolean
        default: true

      access_point_arn:
        description: "ARN of the EFS access point"
        required: false
        type: string
        default: ""

      tag_service:
        description: "Service tag"
        required: false
        type: string
        default: ""

      tag_environment:
        description: "Environment tag"
        required: false
        type: string
        default: "production"

      tag_owner:
        description: "Owner tag"
        required: false
        type: string
        default: "Allen"

      extra_artisan_pre_build:
        description: "Additional bash commands to run before frontend build (e.g. php artisan feed:install)"
        required: false
        type: string
        default: ""

      extra_lambda_layer_arns:
        description: "Additional Lambda layer ARNs in JSON list format"
        required: false
        type: string
        default: "[]"

      php_version:
        description: "PHP version to use"
        required: false
        type: string
        default: "8.5"

      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-west-2"

      state_bucket:
        description: "S3 bucket storing Terraform state"
        required: false
        type: string
        default: "us-west-2-terraform-state-storage"

      ssm_parameter_name:
        description: "AWS SSM Parameter Store name containing the Laravel JSON environment variables"
        required: true
        type: string

      state_key:
        description: "Terraform state key (defaults to us-west-2-<app_name>-serverless.tfstate)"
        required: false
        type: string
        default: ""

      aws_role_arn:
        description: "AWS IAM Role ARN to assume via GitHub OIDC"
        required: false
        type: string
        default: "arn:aws:iam::154471991214:role/github_action"

permissions:
  id-token: write
  contents: read

jobs:
  deploy-laravel-to-lambda:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Package Laravel Application
        run: |
          git clone "${{ inputs.github_repo_url }}" laravel-app
          cd laravel-app

          # Install composer dependencies
          composer install --prefer-dist --optimize-autoloader --no-dev
          php artisan config:clear

          # Run extra pre-build commands if specified
          # The ':' no-op keeps the block valid when the input is empty.
          # Actions substitutes the input at the YAML layer, so an unset
          # value would otherwise leave 'then' with no commands.
          if [ -n "${{ inputs.extra_artisan_pre_build }}" ]; then
            :
            ${{ inputs.extra_artisan_pre_build }}
          fi

          # Build frontend assets, picking the package manager from the lockfile
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm run build
          elif [ -f package-lock.json ]; then
            npm ci
            npm run build
          elif [ -f package.json ]; then
            echo "::error::package.json present but no pnpm-lock.yaml or package-lock.json found"
            exit 1
          else
            echo "no package.json, skipping frontend build"
          fi

          # Remove unnecessary files before packaging
          rm -rf node_modules
          rm -rf public/storage
          rm -rf resources/assets
          rm -rf resources/css
          rm -rf resources/images
          rm -rf resources/js
          rm -rf resources/ts
          rm -rf storage
          rm -rf tests
          rm -rf .git
          rm -rf .github
          rm -f database/database.sqlite

          # Zip the laravel app
          zip --quiet --recurse-paths --symlinks "../terraform/laravel-app.zip" .

      - name: Deploy with Terraform
        working-directory: terraform
        env:
          TF_VAR_app_name: ${{ inputs.app_name }}
          TF_VAR_aws_region: ${{ inputs.aws_region }}
          TF_VAR_tag_service: ${{ inputs.tag_service != '' && inputs.tag_service || inputs.app_name }}
          TF_VAR_tag_environment: ${{ inputs.tag_environment }}
          TF_VAR_tag_owner: ${{ inputs.tag_owner }}
          TF_VAR_custom_domain_name: ${{ inputs.custom_domain_name }}
          TF_VAR_certificate_arn: ${{ inputs.certificate_arn }}
          TF_VAR_aws_bucket: ${{ inputs.aws_bucket }}
          TF_VAR_enable_vpc: ${{ inputs.enable_vpc }}
          TF_VAR_subnet_ids: ${{ inputs.subnet_ids }}
          TF_VAR_security_group_ids: ${{ inputs.security_group_ids }}
          TF_VAR_enable_filesystem: ${{ inputs.enable_filesystem }}
          TF_VAR_access_point_arn: ${{ inputs.access_point_arn }}
          TF_VAR_extra_lambda_layer_arns: ${{ inputs.extra_lambda_layer_arns }}
          TF_VAR_filename: "./laravel-app.zip"
          TF_VAR_ssm_parameter_name: ${{ inputs.ssm_parameter_name }}
        run: |
          STATE_KEY="${{ inputs.state_key }}"
          if [ -z "$STATE_KEY" ]; then
            STATE_KEY="us-west-2-${{ inputs.app_name }}-serverless.tfstate"
          fi

          terraform init \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="use_lockfile=true"

          terraform apply -auto-approve

      - name: Sync static assets to S3
        if: inputs.asset_bucket != ''
        run: |
          aws s3 sync laravel-app/public "s3://${{ inputs.asset_bucket }}"
